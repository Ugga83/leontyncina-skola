name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obnovit namluvené věty z mezipaměti
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/www/voice/*.mp3
          key: voice-vlasta-${{ hashFiles('app/src/main/assets/www/voice/phrases.json') }}
          restore-keys: voice-vlasta-

      - name: Namluvit věty českým hlasem (Microsoft Vlasta)
        continue-on-error: true
        run: |
          pip install --quiet edge-tts
          python tools/gen_voice.py

      - name: Sestavit APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/leontyncina-skola.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leontyncina-skola-apk
          path: out/leontyncina-skola.apk

      - name: Zveřejnit ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leontýnčina škola 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Stáhni soubor **leontyncina-skola.apk** přímo v telefonu a nainstaluj ho.
          files: out/leontyncina-skola.apk
