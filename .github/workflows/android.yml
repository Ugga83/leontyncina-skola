name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sestavit APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/leontyncina-skola.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leontyncina-skola-apk
          path: out/leontyncina-skola.apk

      # Vydává se jen ručně (Actions → Sestavit APK → Run workflow) nebo commitem se slovem [vydat]
      - name: Zveřejnit ke stažení (Releases)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vydat]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leontýnčina škola 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Stáhni soubor **leontyncina-skola.apk** přímo v telefonu a nainstaluj ho.
          files: out/leontyncina-skola.apk
