name: Namluvit slabiky

# Re-records all syllables and short vowels (voice/fixed) with the exact pronunciation whenever
# tools/google_syllables.py changes, then copies them into the app's voice folder.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/google_syllables.py

permissions:
  contents: write

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syllables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Namluvit slabiky
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY || secrets.SPEECH_API_KEY }}
        run: |
          python tools/google_syllables.py
          python tools/gen_voice.py
      - name: Uložit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/voice
          if git diff --cached --quiet; then echo "Nic nového"; exit 0; fi
          git commit -m "Slabiky namluvené znovu (hlas E)"
          git push
