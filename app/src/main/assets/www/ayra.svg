<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Ayra, a fluffy white Samoyed: cream-white fur, liver-brown nose, almond eyes, soft big ruff, "samoyed smile" -->
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f0e8da"/>
    </radialGradient>
    <radialGradient id="ruff" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </radialGradient>
  </defs>
  <g transform="translate(6,1) scale(0.9)">

  <!-- soft fluffy ruff / chest (scalloped fur) -->
  <g fill="url(#ruff)" stroke="#ddd2c0" stroke-width="2">
    <circle cx="20" cy="66" r="13"/><circle cx="100" cy="66" r="13"/>
    <circle cx="22" cy="84" r="14"/><circle cx="98" cy="84" r="14"/>
    <circle cx="34" cy="100" r="15"/><circle cx="86" cy="100" r="15"/>
    <circle cx="50" cy="108" r="14"/><circle cx="70" cy="108" r="14"/>
    <circle cx="60" cy="104" r="15"/>
    <circle cx="24" cy="50" r="11"/><circle cx="96" cy="50" r="11"/>
  </g>
  <g fill="url(#ruff)">
    <circle cx="60" cy="80" r="36"/>
    <circle cx="24" cy="70" r="11"/><circle cx="96" cy="70" r="11"/>
    <circle cx="26" cy="85" r="11"/><circle cx="94" cy="85" r="11"/>
    <circle cx="37" cy="98" r="12"/><circle cx="83" cy="98" r="12"/>
    <circle cx="51" cy="104" r="11"/><circle cx="69" cy="104" r="11"/>
  </g>
  <!-- fur strands on the ruff -->
  <path d="M18,76 q4,2 6,6 M102,76 q-4,2 -6,6 M28,96 q4,0 7,4 M92,96 q-4,0 -7,4 M50,110 q2,-4 5,-5 M70,110 q-2,-4 -5,-5"
        fill="none" stroke="#e3d8c6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ears: small triangles with rounded tips, fluffy -->
  <path d="M30,46 Q27,24 34,13 Q46,19 53,35 Z" fill="url(#fur)" stroke="#ddd2c0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M90,46 Q93,24 86,13 Q74,19 67,35 Z" fill="url(#fur)" stroke="#ddd2c0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M35,39 Q34,26 37,20 Q44,25 47,33 Z" fill="#ead0bf"/>
  <path d="M85,39 Q86,26 83,20 Q76,25 73,33 Z" fill="#ead0bf"/>

  <!-- head: broad fluffy skull narrowing to a wedge muzzle -->
  <path fill="url(#fur)" stroke="#ddd2c0" stroke-width="2"
    d="M60,27 C79,27 93,38 94,55 C95,68 88,77 80,84 C74,90 67,93 60,93 C53,93 46,90 40,84 C32,77 25,68 26,55 C27,38 41,27 60,27 Z"/>
  <!-- cheek fluff -->
  <path d="M27,60 q-5,5 -2,10 q-4,4 0,8 M93,60 q5,5 2,10 q4,4 0,8" fill="none" stroke="#ddd2c0" stroke-width="2" stroke-linecap="round"/>
  <path d="M51,31 q4,-5 9,0 q5,-5 9,0" fill="none" stroke="#e8decf" stroke-width="2" stroke-linecap="round"/>

  <!-- soft cream shading around eyes -->
  <ellipse cx="45" cy="57" rx="10" ry="6.5" fill="#efe4d2" opacity=".75"/>
  <ellipse cx="75" cy="57" rx="10" ry="6.5" fill="#efe4d2" opacity=".75"/>

  <!-- almond eyes, slightly slanted, dark brown -->
  <path d="M37,58 Q44,47.5 53,55.5 Q46,65.5 37,58 Z" fill="#3b2a22"/>
  <path d="M83,58 Q76,47.5 67,55.5 Q74,65.5 83,58 Z" fill="#3b2a22"/>
  <circle cx="47" cy="55" r="2.3" fill="#fff"/>
  <circle cx="73" cy="55" r="2.3" fill="#fff"/>

  <!-- muzzle (blends into the face) -->
  <path d="M60,63 C69,63 74,70 73,77 C72,84 66,87 60,87 C54,87 48,84 47,77 C46,70 51,63 60,63 Z" fill="#ffffff" opacity=".9"/>

  <!-- liver-brown nose -->
  <path d="M52.5,69 Q60,64.5 67.5,69 Q66.5,75.5 60,77.5 Q53.5,75.5 52.5,69 Z" fill="#8a5446"/>
  <ellipse cx="57.5" cy="68.6" rx="2.8" ry="1.4" fill="#b37e6e"/>

  <!-- samoyed smile + tongue -->
  <path d="M60,77.5 L60,80.5" stroke="#5a3a32" stroke-width="2" stroke-linecap="round"/>
  <path d="M50,80 Q55,86.5 60,80.5 Q65,86.5 70,80" fill="none" stroke="#5a3a32" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M55.5,84 Q60,93 64.5,84 Q60,86.5 55.5,84 Z" fill="#f08a9b" stroke="#d96a7e" stroke-width="1"/>
  </g>
</svg>
